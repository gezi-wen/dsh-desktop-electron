<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- 深灰磨砂背景 -->
  <rect width="100" height="100" rx="22" fill="#1E1F24"/>
  <!-- 外层深灰圆角方框（捕捉信息） -->
  <rect x="15" y="15" width="70" height="70" rx="10" fill="none" stroke="#3A3C42" stroke-width="3.5" opacity="0.8"/>
  <!-- 中层暖灰旋转正方形（逻辑解析） -->
  <rect x="30" y="30" width="40" height="40" rx="6" fill="none" stroke="#D4CBB5" stroke-width="3.5" transform="rotate(45 50 50)"/>
  <!-- 内层未闭合弧线（持续追问）——昼殿：日光金 -->
  <path d="M 43 50 A 7 7 0 1 0 46.5 43.94" fill="none" stroke="#E8B84B" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
</svg>
